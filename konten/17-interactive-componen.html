<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Styling</title>
    <link href="../dist/output.css" rel="stylesheet">
</head>

<body class="bg-slate-100 min-h-screen">
    <h1 class="text-3xl font-bold text-slate-800">Interactive Components</h1>

    <div class="group p-6 bg-white rounded-xl shadow hover:bg-blue-600">
        <h2 class="text-xl font-bold text-gray-800 group-hover:text-white">Dashboard Admin</h2>
        <p class="text-gray-600 group-hover:text-white">Selamat datang di aplikasiku</p>
    </div>

    <div class="gap-8 mb-4">
        <label class="flex items-center gap-3 p-4 bg-gray-100 rounded-lg">
            <input class="peer" type="checkbox" />
            <span class="text-gray-700 peer-checked:text-green-600 peer-checked:font-bold">
                Saya menyetujui persyaratan
            </span>
        </label>
    </div>

    <div class="max-w-sm mx-auto p-6">

        <label class="block group cursor-pointer
                  bg-white p-5 rounded-xl shadow
                  border border-gray-200
                  hover:border-blue-500
                  hover:shadow-lg">

            <input type="checkbox" class="peer">

            <h2 class="mt-3 text-xl font-bold
                   text-gray-800
                   group-hover:text-blue-600
                   peer-checked:text-green-600">
                Layanan Pajak
            </h2>

            <p class="mt-2 text-gray-600
                  group-hover:text-blue-500">
                Pilih layanan ini untuk melanjutkan.
            </p>

            <span class="mt-4 inline-block text-sm
                     text-gray-500
                     peer-checked:text-green-600
                     peer-checked:font-bold">
                Belum dipilih
            </span>

        </label>

    </div>

</body>

</html>
