<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hari 6 Sizing & Layout</title>
    <link rel="stylesheet" href="../dist/output.css" />
  </head>
  <body>
    <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
      <!-- Modal Container (w-full dipadu max-w-md agar adaptif) -->
      <div
        class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col"
      >
        <!-- Header Modal -->
        <div class="p-6 border-b border-slate-100">
          <h3 class="text-lg font-bold text-slate-800">Media Penyimpanan</h3>
          <p class="text-xs text-slate-500 mt-1">
            Kelola kuota ruang kerja tim Anda.
          </p>
        </div>

        <!-- Body Modal dengan Batasan Tinggi (max-h) & Scroll -->
        <div class="p-6 space-y-4 max-h-72 overflow-y-auto">
          <!-- Progress Bar (Kombinasi h-* dan w-*) -->
          <div>
            <div
              class="flex justify-between text-xs font-semibold text-slate-600 mb-1.5"
            >
              <span>Penggunaan Disk</span>
              <span>78%</span>
            </div>
            <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
              <div class="w-[78%] h-full bg-indigo-600 rounded-full"></div>
            </div>
          </div>

          <!-- Item List dengan Ukuran Ikon Tetap -->
          <div class="space-y-3 pt-2">
            <div
              class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100"
            >
              <!-- Kotak ikon dengan ukuran tetap w-10 h-10 (tidak boleh menciut/shrink) -->
              <div
                class="w-10 h-10 shrink-0 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center font-bold text-sm"
              >
                DOC
              </div>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-semibold text-slate-800 truncate">
                  Dokumen-Panduan-Sistem-Design-UI.pdf
                </p>
                <p class="text-xs text-slate-400">14.2 MB</p>
              </div>
            </div>

            <div
              class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100"
            >
              <div
                class="w-10 h-10 shrink-0 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center font-bold text-sm"
              >
                IMG
              </div>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-semibold text-slate-800 truncate">
                  Banner-Assets-Promosi-Akhir-Tahun.zip
                </p>
                <p class="text-xs text-slate-400">84.5 MB</p>
              </div>
            </div>

            <div
              class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100"
            >
              <div
                class="w-10 h-10 shrink-0 bg-amber-100 text-amber-600 rounded-lg flex items-center justify-center font-bold text-sm"
              >
                VID
              </div>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-semibold text-slate-800 truncate">
                  Tutorial-Sizing-Tailwind-Lengkap.mp4
                </p>
                <p class="text-xs text-slate-400">210 MB</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer Modal dengan Tombol Ukuran Konsisten -->
        <div
          class="p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-3"
        >
          <button
            class="h-10 px-4 text-xs font-semibold text-slate-600 hover:text-slate-800 rounded-lg transition"
          >
            Batal
          </button>
          <button
            class="h-10 min-w-28 px-4 bg-indigo-600 text-white text-xs font-semibold rounded-lg hover:bg-indigo-700 transition"
          >
            Tingkatkan Kuota
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
