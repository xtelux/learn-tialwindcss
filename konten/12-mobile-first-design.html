<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid</title>
    <link href="../dist/output.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

    <main class="p-4 md:p-8 lg:p-12">

        <h1 class="text-2xl font-bold mb-6">
            Daftar Produk
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-lg font-bold">Produk 1</h2>
                <p class="text-gray-600">Deskripsi produk pertama.</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-lg font-bold">Produk 2</h2>
                <p class="text-gray-600">Deskripsi produk kedua.</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-lg font-bold">Produk 3</h2>
                <p class="text-gray-600">Deskripsi produk ketiga.</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-lg font-bold">Produk 4</h2>
                <p class="text-gray-600">Deskripsi produk keempat.</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-lg font-bold">Produk 5</h2>
                <p class="text-gray-600">Deskripsi produk kelima.</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-lg font-bold">Produk 6</h2>
                <p class="text-gray-600">Deskripsi produk keenam.</p>
            </div>

        </div>

    </main>

</body>
</html>
