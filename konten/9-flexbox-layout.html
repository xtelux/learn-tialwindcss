<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hari 9 flexbox layout</title>
    <link rel="stylesheet" href="../dist/output.css" />
  </head>
  <body>
   <div class="min-h-screen bg-slate-100 font-sans p-6 space-y-8">

  <!-- 1. APPLICATION NAVBAR (flex, justify-between, items-center) -->
  <header class="bg-white rounded-2xl border border-slate-200 px-6 py-3 shadow-xs">
    <div class="flex items-center justify-between">
      
      <!-- Brand Logo / Left Section -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white font-black flex items-center justify-center text-sm">
          UI
        </div>
        <span class="font-bold text-slate-800 text-base">FlexStudio</span>
      </div>

      <!-- Navigation Links (Center Section) -->
      <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">
        <a href="#" class="text-indigo-600 font-semibold">Beranda</a>
        <a href="#" class="hover:text-slate-900 transition">Fitur</a>
        <a href="#" class="hover:text-slate-900 transition">Harga</a>
        <a href="#" class="hover:text-slate-900 transition">Dokumentasi</a>
      </nav>

      <!-- User Action (Right Section) -->
      <div class="flex items-center gap-3">
        <button class="text-xs font-semibold text-slate-600 hover:text-slate-800 px-3 py-2 rounded-lg">
          Masuk
        </button>
        <button class="text-xs font-semibold bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition shadow-xs">
          Daftar
        </button>
      </div>

    </div>
  </header>

  <!-- 2. FILTER & CATEGORY LIST (flex-wrap & gap) -->
  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs max-w-3xl mx-auto">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100">
      <div>
        <h2 class="text-base font-bold text-slate-800">Kategori Eksplorasi</h2>
        <p class="text-xs text-slate-500 mt-0.5">Pilih topik filter yang ingin ditampilkan</p>
      </div>
      <button class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 self-start sm:self-auto">
        Reset Filter
      </button>
    </div>

    <!-- Container dengan flex-wrap agar tag meluap rapi ke baris berikutnya -->
    <div class="flex flex-wrap gap-2.5 pt-5">
      <button class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-medium">
        Semua Topik
      </button>
      <button class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition">
        Web Design
      </button>
      <button class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition">
        Design Systems
      </button>
      <button class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition">
        Tailwind CSS
      </button>
      <button class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition">
        Responsive Layout
      </button>
      <button class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition">
        Typography & Sizing
      </button>
      <button class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition">
        Micro-interactions
      </button>
      <button class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition">
        User Experience
      </button>
    </div>
  </div>

</div>
  </body>
</html>
