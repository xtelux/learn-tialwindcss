
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Button</title>
    <link href="../dist/output.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <main class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">

        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            Interactive Button
        </h1>

        <div class="flex flex-col gap-5">

            <!-- Hover Button -->
            <button class="bg-blue-600 text-white py-3 rounded-lg
                           hover:bg-blue-800 hover:scale-105
                           transition">
                Hover Button
            </button>

            <!-- Focus Button -->
            <button class="bg-green-600 text-white py-3 rounded-lg
                           focus:outline-none focus:ring-4
                           focus:ring-green-300">
                Focus Button
            </button>

            <!-- Active Button -->
            <button class="bg-purple-600 text-white py-3 rounded-lg
                           active:scale-95 active:bg-purple-900">
                Active Button
            </button>

            <!-- Disabled Button -->
            <button disabled
                class="bg-gray-400 text-white py-3 rounded-lg
                       disabled:cursor-not-allowed
                       disabled:opacity-50">
                Disabled Button
            </button>

            <!-- Visited Link -->
            <a href="https://tailwindcss.com"
               class="text-blue-600 underline
                      visited:text-purple-700">
                Dokumentasi Tailwind CSS
            </a>

        </div>

    </main>

</body>
</html>
