<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hari 5 Spacing</title>
    <link rel="stylesheet" href="../dist/output.css" />
  </head>
  <body>
    <div class="max-w-sm mx-auto my-12 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden font-sans">
  
  <!-- Cover Area (Menggunakan Sizing & Padding) -->
  <div class="h-28 bg-gradient-to-r from-blue-600 to-indigo-600 relative">
    <!-- Avatar dengan margin negatif untuk overlapping visual -->
    <div class="absolute -bottom-10 left-6">
      <div class="w-20 h-20 rounded-full border-4 border-white bg-slate-200 flex items-center justify-center text-slate-600 font-bold text-xl shadow-sm">
        BS
      </div>
    </div>
  </div>

  <!-- Content Body (Padding Utama Kartu) -->
  <div class="pt-14 px-6 pb-6">

    <!-- Header Section (Jarak rapat / Proximity) -->
    <div>
      <h2 class="text-xl font-bold text-slate-800">Budi Santoso</h2>
      <p class="text-xs text-slate-500 mt-0.5">Senior Product Designer</p>
    </div>

    <!-- Bio (Jarak sedang dari header) -->
    <p class="text-sm text-slate-600 leading-relaxed mt-4">
      Fokus membangun desain sistem modular dan pengalaman pengguna berbasis utility CSS.
    </p>

    <!-- Stats Bar (Menggunakan Flex dan Gap) -->
    <div class="flex items-center justify-between border-y border-slate-100 py-3 my-5">
      <div class="text-center">
        <p class="text-base font-bold text-slate-800">128</p>
        <p class="text-xs text-slate-400">Proyek</p>
      </div>
      <div class="h-8 w-px bg-slate-200"></div>
      <div class="text-center">
        <p class="text-base font-bold text-slate-800">14.2k</p>
        <p class="text-xs text-slate-400">Pengikut</p>
      </div>
      <div class="h-8 w-px bg-slate-200"></div>
      <div class="text-center">
        <p class="text-base font-bold text-slate-800">4.9</p>
        <p class="text-xs text-slate-400">Rating</p>
      </div>
    </div>

    <!-- Action Buttons (Flex dengan Gap) -->
    <div class="flex gap-3">
      <button class="flex-1 bg-indigo-600 text-white text-sm font-semibold py-2.5 px-4 rounded-xl shadow-xs hover:bg-indigo-700 transition">
        Ikuti
      </button>
      <button class="flex-1 bg-slate-100 text-slate-700 text-sm font-semibold py-2.5 px-4 rounded-xl hover:bg-slate-200 transition">
        Pesan
      </button>
    </div>

  </div>

</div>
  </body>
</html>
