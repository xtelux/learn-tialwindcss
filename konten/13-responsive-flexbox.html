<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Navbar</title>
    <link href="../dist/output.css" rel="stylesheet" />
  </head>

  <body class="bg-gray-100">
    <header class="bg-white shadow">
      <nav class="max-w-7xl mx-auto p-4">
        <div
          class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4"
        >
          <!-- Logo -->
          <div class="order-1">
            <h1 class="text-2xl font-bold text-blue-600">MyWebsite</h1>
          </div>

          <!-- Tombol Login -->
          <div class="order-2 md:order-3">
            <button class="w-full md:w-auto bg-blue-600 text-white px-4 py-2 rounded-lg">
              Login
            </button>
          </div>

          <!-- Menu Navigasi -->
          <ul
            class="order-3 md:order-2 flex flex-col md:flex-row md:flex-wrap items-start md:items-center gap-3 md:gap-6"
          >
            <li>
              <a href="#" class="text-gray-700 hover:text-blue-600"> Home </a>
            </li>

            <li>
              <a href="#" class="text-gray-700 hover:text-blue-600"> About </a>
            </li>

            <li>
              <a href="#" class="text-gray-700 hover:text-blue-600">
                Services
              </a>
            </li>

            <li>
              <a href="#" class="text-gray-700 hover:text-blue-600">
                Contact
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="p-6">
      <h2 class="text-2xl font-bold">Selamat Datang</h2>

      <p class="mt-2 text-gray-600">
        Ini adalah contoh website dengan responsive navbar.
      </p>
    </main>
  </body>
</html>
